name: Update Fam Ai news and voices

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news-and-voices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install voice generator
        run: pip install --disable-pip-version-check edge-tts mutagen

      - name: Fetch current news
        run: |
          mkdir -p tools
          cp fetch_news.py tools/fetch_news.py
          python tools/fetch_news.py

      - name: Generate Thai narration for current news
        run: |
          cat > generate_live_voices.py <<'PY'
          #!/usr/bin/env python3
          # Generates voice data for the current news feed. Run by GitHub Actions.
          import asyncio
          import base64
          import json
          import re
          import tempfile
          from pathlib import Path
          
          import edge_tts
          from mutagen.mp3 import MP3
          
          ROOT = Path(__file__).resolve().parent
          NEWS_FILE = ROOT / 'news.json'
          OUT_FILE = ROOT / 'voices.js'
          VOICE = 'th-TH-NiwatNeural'
          RATE = '+30%'
          MAX_TEXT = 500
          CONCURRENCY = 3
          
          
          def clean(value):
              return re.sub(r'\s+', ' ', str(value or '')).strip()
          
          
          def chunks_for(text, limit=42):
              parts = re.split(r'(?<=[.!?。！？])\s*|\s*(?:—|–)\s*', text)
              chunks, buf = [], ''
              for part in (clean(p) for p in parts):
                  if not part:
                      continue
                  if buf and len(buf) + len(part) + 1 > limit:
                      chunks.append(buf)
                      buf = part
                  else:
                      buf = (buf + ' ' + part).strip()
              if buf:
                  chunks.append(buf)
              return chunks or [text]
          
          
          async def make_one(item, semaphore, tmpdir):
              item_id = clean(item.get('id'))
              title = clean(item.get('title'))
              desc = clean(item.get('desc'))
              if not item_id or not title:
                  return item_id, None
              script = clean((title + '. ' + desc)[:MAX_TEXT])
              filename = Path(tmpdir) / (item_id + '.mp3')
              try:
                  async with semaphore:
                      speaker = edge_tts.Communicate(script, voice=VOICE, rate=RATE)
                      await speaker.save(str(filename))
                  raw = filename.read_bytes()
                  duration = max(1.0, float(MP3(str(filename)).info.length))
                  chunks = chunks_for(script)
                  total_chars = max(1, sum(len(c) for c in chunks))
                  elapsed = 0.0
                  bounds = []
                  for chunk in chunks:
                      bounds.append(round(duration * elapsed / total_chars, 2))
                      elapsed += len(chunk)
                  return item_id, {
                      'script': script,
                      'chunks': chunks,
                      'bounds': bounds,
                      'dur': round(duration, 2),
                      'src': 'data:audio/mpeg;base64,' + base64.b64encode(raw).decode('ascii'),
                  }
              except Exception as exc:
                  print('voice failed:', item_id, exc)
                  return item_id, None
          
          
          async def main():
              feed = json.loads(NEWS_FILE.read_text(encoding='utf-8'))
              items = list(feed.get('items') or [])[:60]
              semaphore = asyncio.Semaphore(CONCURRENCY)
              with tempfile.TemporaryDirectory(prefix='fam-ai-voice-') as tmpdir:
                  pairs = await asyncio.gather(*(make_one(item, semaphore, tmpdir) for item in items))
              voices = {key: value for key, value in pairs if key and value}
              if not voices:
                  raise RuntimeError('No voices were generated; news and voices were not committed.')
              OUT_FILE.write_text(
                  '// Generated by GitHub Actions — do not edit manually.\n'
                  'window.FAM_LIVE_NEWS_VOICE = ' + json.dumps(voices, ensure_ascii=False, separators=(',', ':')) + ';\n',
                  encoding='utf-8',
              )
              print('generated', len(voices), 'current-news voices')
          
          
          if __name__ == '__main__':
              asyncio.run(main())
          PY
          python generate_live_voices.py

      - name: Commit refreshed news and narration
        run: |
          git config user.name "Fam Ai Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json voices.js
          if git diff --cached --quiet; then
            echo "No news changes to commit"
          else
            git commit -m "chore(news): update news and Thai narration"
            git push
          fi
