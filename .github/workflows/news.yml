name: Update Fam Ai news

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest news
        run: |
          # fetch_news.py is currently stored at the repository root.
          # Running a copy from tools/ makes its output path resolve to news.json in this repository.
          mkdir -p tools
          cp fetch_news.py tools/fetch_news.py
          python tools/fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name "Fam Ai Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit"
          else
            git commit -m "chore(news): update latest feed"
            git push
          fi
