# ─────────────────────────────────────────────────────────────
# Fam Ai — อัปเดตข่าวอัตโนมัติ (ไม่บังคับ)
#
# GitHub บังคับให้ไฟล์ workflow ต้องอยู่ในโฟลเดอร์ .github/workflows/ เท่านั้น
# วิธีใช้บนมือถือ:
#   1) ในหน้า repo กด  Add file → Create new file
#   2) ช่องชื่อไฟล์พิมพ์:  .github/workflows/news.yml
#   3) ก๊อปเนื้อหาไฟล์นี้ทั้งไฟล์ไปวาง → Commit changes
#   4) ไปที่แท็บ Actions → กด "I understand my workflows, go ahead and enable them"
# ─────────────────────────────────────────────────────────────
name: Update Fam Ai news

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ดึงข่าวล่าสุด
        run: python fetch_news.py
      - name: commit ถ้ามีการเปลี่ยนแปลง
        run: |
          git config user.name "Fam Ai Bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --quiet --cached && echo "ไม่มีข่าวใหม่" && exit 0
          git commit -m "chore(news): update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
